name: avito-recap

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avito-recap}
      POSTGRES_USER: ${POSTGRES_USER:-avito-recap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito-recap}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./apps/backend/database/migrations:/migrations:ro
      - ./apps/backend/scripts/run-migrations.sh:/run-migrations.sh:ro
    entrypoint: ["/bin/sh", "/run-migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDRESS: :8080
      HTTP_SHUTDOWN_TIMEOUT: 10s
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-avito-recap}:${POSTGRES_PASSWORD:-avito-recap}@postgres:5432/${POSTGRES_DB:-avito-recap}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      catalog-import:
        condition: service_completed_successfully
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.generator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-avito-recap}:${POSTGRES_PASSWORD:-avito-recap}@postgres:5432/${POSTGRES_DB:-avito-recap}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  catalog-import:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.catalog-import
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-avito-recap}:${POSTGRES_PASSWORD:-avito-recap}@postgres:5432/${POSTGRES_DB:-avito-recap}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
