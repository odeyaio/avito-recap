# yaml-language-server: $schema=./behavior-catalog.schema.json

version: v6

behaviors:
  - code: explorer
    name: Исследователь
    description: Много уникальных просмотров и категорий, мало контактов
    sortOrder: 10
    rule:
      all:
        - metric: activity.unique_listings_viewed
          operator: gte
          value: 100
        - metric: interests.distinct_categories
          operator: gte
          value: 5
        - metric: intent.contacted_unique_listings
          operator: lte
          value: 3
    defaultAction:
      code: open_frequent_interest_feed
      title: Посмотреть предложения по частым интересам
      targetType: search
      href: https://www.avito.ru/rossiya?q={category}

  - code: determined_buyer
    name: Целеустремлённый покупатель
    description: Узкий интерес, повторные просмотры, избранное и контакты
    sortOrder: 20
    rule:
      all:
        - metric: interests.top_category_share
          operator: gte
          value: 0.6
        - metric: intent.repeat_viewed_listings
          operator: gte
          value: 5
        - metric: intent.favorites_added
          operator: gte
          value: 3
        - metric: intent.contacted_unique_listings
          operator: gte
          value: 2
    defaultAction:
      code: return_to_current_options
      title: Вернуться к актуальным вариантам
      targetType: favorites
      href: https://www.avito.ru/favorites

  - code: favorite_collector
    name: Коллекционер избранного
    description: Много сохранений, но мало контактов
    sortOrder: 30
    rule:
      all:
        - metric: intent.favorites_added
          operator: gte
          value: 20
        - metric: intent.contacted_unique_listings
          operator: lte
          value: 2
    defaultAction:
      code: open_active_favorites
      title: Открыть актуальное избранное
      targetType: favorites
      href: https://www.avito.ru/favorites

  - code: active_buyer
    name: Активный покупатель
    description: Регулярные контакты и несколько завершённых покупок
    sortOrder: 40
    rule:
      all:
        - metric: intent.contacted_unique_listings
          operator: gte
          value: 10
        - metric: marketplace.purchases
          operator: gte
          value: 3
    defaultAction:
      code: view_favorite_category_offers
      title: Посмотреть новые предложения в любимой категории
      targetType: search
      href: https://www.avito.ru/rossiya?q={category}

  - code: new_arrivals_hunter
    name: Охотник за новинками
    description: Часто открывает свежие объявления и переходит из уведомлений
    sortOrder: 50
    rule:
      all:
        - metric: activity.fresh_listing_view_share
          operator: gte
          value: 0.5
        - metric: features.notification_opens
          operator: gte
          value: 5
    defaultAction:
      code: enable_top_search_notifications
      title: Включить уведомления для главного поиска
      targetType: saved_searches
      href: https://www.avito.ru/favorites/searches

  - code: careful_chooser
    name: Внимательный выбирающий
    description: Использует фильтры, сравнивает и возвращается к объявлениям
    sortOrder: 60
    rule:
      all:
        - metric: features.searches_with_filters
          operator: gte
          value: 10
        - metric: intent.careful_contact_paths
          operator: gte
          value: 3
    defaultAction:
      code: continue_comparison
      title: Продолжить сравнение подходящих вариантов
      targetType: favorites
      href: https://www.avito.ru/favorites

  - code: novice_seller
    name: Начинающий продавец
    description: Создал первые объявления, но имеет мало завершённых продаж
    sortOrder: 70
    rule:
      all:
        - metric: marketplace.published_listings
          operator: gte
          value: 1
        - metric: marketplace.sales
          operator: lte
          value: 1
    defaultAction:
      code: improve_or_publish_listing
      title: Улучшить или опубликовать объявление
      targetType: listings
      href: https://www.avito.ru/profile/items/inactive

  - code: active_seller
    name: Активный продавец
    description: Регулярно публикует объявления и получает контакты
    sortOrder: 80
    rule:
      all:
        - metric: marketplace.published_listings
          operator: gte
          value: 5
        - metric: marketplace.listing_contacts
          operator: gte
          value: 10
    defaultAction:
      code: publish_new_listing
      title: Разместить новое объявление
      targetType: listing_form
      href: https://www.avito.ru/additem

  - code: effective_seller
    name: Эффективный продавец
    description: Высокая доля объявлений завершается продажей
    sortOrder: 90
    rule:
      all:
        - metric: marketplace.sale_completion_rate
          operator: gte
          value: 0.6
        - metric: marketplace.sales
          operator: gte
          value: 3
    defaultAction:
      code: open_seller_statistics
      title: Посмотреть статистику и продать ещё
      targetType: seller_statistics
      href: https://www.avito.ru/business/tools/analytics

  - code: delivery_user
    name: Пользователь доставки
    description: Значительная часть сделок проходит с доставкой
    sortOrder: 100
    rule:
      all:
        - metric: marketplace.delivery_share
          operator: gte
          value: 0.5
        - metric: intent.completed_deals
          operator: gte
          value: 3
    defaultAction:
      code: enable_delivery_on_listings
      title: Подключить доставку к активным объявлениям
      targetType: listings
      href: https://www.avito.ru/profile/items/active

  - code: community_member
    name: Участник сообщества
    description: Регулярно оставляет отзывы и получает оценки
    sortOrder: 110
    rule:
      all:
        - metric: community.reviews_left
          operator: gte
          value: 3
        - metric: community.reviews_received
          operator: gte
          value: 3
    defaultAction:
      code: leave_latest_deal_review
      title: Оставить отзыв по последней сделке
      targetType: reviews
      href: https://www.avito.ru/profile/reviews

  - code: unfinished_intent
    name: Пользователь с незавершённым намерением
    description: Повторяет поисковые запросы или добавляет объявления в избранное, но не связывается с продавцами
    sortOrder: 120
    rule:
      all:
        - any:
            - metric: intent.repeated_searches
              operator: gte
              value: 3
            - metric: intent.favorites_added
              operator: gte
              value: 5
        - metric: intent.contacted_unique_listings
          operator: eq
          value: 0
    defaultAction:
      code: return_to_matching_listings
      title: Вернуться к подходящим объявлениям
      targetType: favorites
      href: https://www.avito.ru/favorites

  - code: rare_user
    name: Редкий пользователь
    description: Небольшое количество действий за год
    sortOrder: 130
    rule:
      all:
        - metric: activity.total_actions
          operator: lte
          value: 10
        - metric: activity.active_days
          operator: lte
          value: 3
    defaultAction:
      code: open_personal_collection
      title: Посмотреть персональную подборку
      targetType: search
      href: https://www.avito.ru/rossiya

  # Catch-all fallback: only matches if none of the more specific behaviors
  # above matched, but the user had at least 1 action in the period. Without
  # it, "medium activity" users (too much for rare_user, not enough for
  # explorer/active_buyer/active_seller/etc.) got 422 insufficient_activity
  # instead of a recap. name/description below are user-facing, not internal.
  - code: casual_activity
    name: Активность за период
    description: Заметная активность за год, но пока без выраженного сценария
    sortOrder: 140
    rule:
      all:
        - metric: activity.total_actions
          operator: gte
          value: 1
    defaultAction:
      code: open_general_catalog
      title: Посмотреть все объявления
      targetType: search
      href: https://www.avito.ru/rossiya
