# yaml-language-server: $schema=./behavior-catalog.schema.json

version: v1

behaviors:
  - code: explorer
    name: Исследователь
    ruleDescription: Много уникальных просмотров и категорий, мало контактов
    sortOrder: 10
    rule:
      all:
        - metric: activity.unique_listings_viewed
          operator: gte
          value: 100
        - metric: interests.distinct_categories
          operator: gte
          value: 5
        - metric: intent.contacted_unique_listings
          operator: lte
          value: 3
    defaultAction:
      code: save_frequent_search
      title: Сохранить наиболее частый поиск
      resolver: frequent_search_without_subscription

  - code: determined_buyer
    name: Целеустремлённый покупатель
    ruleDescription: Узкий интерес, повторные просмотры, избранное и контакты
    sortOrder: 20
    rule:
      all:
        - metric: interests.top_category_share
          operator: gte
          value: 0.6
        - metric: intent.repeat_viewed_listings
          operator: gte
          value: 5
        - metric: intent.favorites_added
          operator: gte
          value: 3
        - metric: intent.contacted_unique_listings
          operator: gte
          value: 2
    defaultAction:
      code: return_to_current_options
      title: Вернуться к актуальным вариантам
      resolver: active_favorite_options

  - code: favorite_collector
    name: Коллекционер избранного
    ruleDescription: Много сохранений, но мало контактов
    sortOrder: 30
    rule:
      all:
        - metric: intent.favorites_added
          operator: gte
          value: 20
        - metric: intent.contacted_unique_listings
          operator: lte
          value: 2
    defaultAction:
      code: open_active_favorites
      title: Открыть актуальное избранное
      resolver: active_favorites

  - code: active_buyer
    name: Активный покупатель
    ruleDescription: Регулярные контакты и несколько завершённых покупок
    sortOrder: 40
    rule:
      all:
        - metric: intent.contacted_unique_listings
          operator: gte
          value: 10
        - metric: marketplace.purchases
          operator: gte
          value: 3
    defaultAction:
      code: view_favorite_category_offers
      title: Посмотреть новые предложения в любимой категории
      resolver: favorite_category_feed

  - code: new_arrivals_hunter
    name: Охотник за новинками
    ruleDescription: Часто открывает свежие объявления и переходит из уведомлений
    sortOrder: 50
    rule:
      all:
        - metric: activity.fresh_listing_view_share
          operator: gte
          value: 0.5
        - metric: features.notification_opens
          operator: gte
          value: 5
    defaultAction:
      code: enable_top_search_notifications
      title: Включить уведомления для главного поиска
      resolver: top_search_without_notification

  - code: careful_chooser
    name: Внимательный выбирающий
    ruleDescription: Использует фильтры, сравнивает и возвращается к объявлениям
    sortOrder: 60
    rule:
      all:
        - metric: features.searches_with_filters
          operator: gte
          value: 10
        - metric: intent.careful_contact_paths
          operator: gte
          value: 3
    defaultAction:
      code: continue_comparison
      title: Продолжить сравнение подходящих вариантов
      resolver: comparison_candidates

  - code: new_interests_lover
    name: Любитель новых интересов
    ruleDescription: Проявил активность в нескольких новых категориях
    sortOrder: 70
    rule:
      all:
        - metric: interests.new_significant_categories
          operator: gte
          value: 2
    defaultAction:
      code: open_new_interest_collection
      title: Посмотреть подборку по новому интересу
      resolver: new_interest_feed

  - code: regular_user
    name: Постоянный пользователь
    ruleDescription: Активен в большинстве месяцев года
    sortOrder: 80
    rule:
      all:
        - metric: activity.active_months
          operator: gte
          value: 10
    defaultAction:
      code: continue_last_scenario
      title: Продолжить последний актуальный сценарий
      resolver: last_active_scenario

  - code: seasonal_user
    name: Сезонный пользователь
    ruleDescription: Основная активность приходится на определённый период
    sortOrder: 90
    rule:
      all:
        - metric: activity.peak_quarter_share
          operator: gte
          value: 0.6
        - metric: activity.active_months
          operator: gte
          value: 2
    defaultAction:
      code: return_to_seasonal_collection
      title: Вернуться к сезонной подборке
      resolver: seasonal_feed

  - code: returning_user
    name: Возвращающийся пользователь
    ruleDescription: Возобновил активность после длительного перерыва
    sortOrder: 100
    rule:
      all:
        - metric: activity.returned_after_long_gap
          operator: eq
          value: true
    defaultAction:
      code: continue_last_search
      title: Продолжить последний поиск
      resolver: last_search

  - code: novice_seller
    name: Начинающий продавец
    ruleDescription: Создал первые объявления, но имеет мало завершённых продаж
    sortOrder: 110
    rule:
      all:
        - metric: marketplace.published_listings
          operator: gte
          value: 1
        - metric: marketplace.sales
          operator: lte
          value: 1
    defaultAction:
      code: improve_or_publish_listing
      title: Улучшить или опубликовать объявление
      resolver: improvable_or_draft_listing

  - code: active_seller
    name: Активный продавец
    ruleDescription: Регулярно публикует объявления и получает контакты
    sortOrder: 120
    rule:
      all:
        - metric: marketplace.published_listings
          operator: gte
          value: 5
        - metric: marketplace.listing_contacts
          operator: gte
          value: 10
    defaultAction:
      code: publish_new_listing
      title: Разместить новое объявление
      resolver: new_listing_form

  - code: effective_seller
    name: Эффективный продавец
    ruleDescription: Высокая доля объявлений завершается продажей
    sortOrder: 130
    rule:
      all:
        - metric: marketplace.sale_completion_rate
          operator: gte
          value: 0.6
        - metric: marketplace.sales
          operator: gte
          value: 3
    defaultAction:
      code: open_seller_statistics
      title: Посмотреть статистику и продать ещё
      resolver: seller_statistics

  - code: delivery_user
    name: Пользователь доставки
    ruleDescription: Значительная часть сделок проходит с доставкой
    sortOrder: 140
    rule:
      all:
        - metric: marketplace.delivery_share
          operator: gte
          value: 0.5
        - metric: intent.completed_deals
          operator: gte
          value: 3
    defaultAction:
      code: enable_delivery_on_listings
      title: Подключить доставку к активным объявлениям
      resolver: active_listings_without_delivery

  - code: community_member
    name: Участник сообщества
    ruleDescription: Регулярно оставляет отзывы и получает оценки
    sortOrder: 150
    rule:
      all:
        - metric: community.reviews_left
          operator: gte
          value: 3
        - metric: community.reviews_received
          operator: gte
          value: 3
    defaultAction:
      code: leave_latest_deal_review
      title: Оставить отзыв по последней сделке
      resolver: completed_deal_without_review

  - code: universal_user
    name: Универсальный пользователь
    ruleDescription: Активен и как покупатель, и как продавец
    sortOrder: 160
    rule:
      all:
        - metric: marketplace.purchases
          operator: gte
          value: 1
        - metric: marketplace.sales
          operator: gte
          value: 1
    defaultAction:
      code: continue_relevant_scenario
      title: Продолжить наиболее актуальный сценарий
      resolver: most_relevant_scenario

  - code: observer
    name: Наблюдатель
    ruleDescription: Много просмотров, почти нет избранного и контактов
    sortOrder: 170
    rule:
      all:
        - metric: activity.views
          operator: gte
          value: 50
        - metric: intent.favorites_added
          operator: lte
          value: 1
        - metric: intent.contacted_unique_listings
          operator: lte
          value: 1
    defaultAction:
      code: save_listing_or_search
      title: Сохранить интересующее объявление или поиск
      resolver: viewed_unsaved_listing_or_search

  - code: unfinished_intent
    name: Пользователь с незавершённым намерением
    ruleDescription: Повторяет поиск или сохраняет объявления, но не связывается с продавцами
    sortOrder: 180
    rule:
      all:
        - any:
            - metric: intent.repeated_searches
              operator: gte
              value: 3
            - metric: intent.favorites_added
              operator: gte
              value: 5
        - metric: intent.contacted_unique_listings
          operator: eq
          value: 0
    defaultAction:
      code: return_to_matching_listings
      title: Вернуться к подходящим объявлениям
      resolver: unfinished_intent_candidates

  - code: rare_user
    name: Редкий пользователь
    ruleDescription: Небольшое количество действий за год
    sortOrder: 190
    rule:
      all:
        - metric: activity.total_actions
          operator: lte
          value: 10
        - metric: activity.active_days
          operator: lte
          value: 3
    defaultAction:
      code: open_personal_collection
      title: Посмотреть персональную подборку
      resolver: personal_feed
